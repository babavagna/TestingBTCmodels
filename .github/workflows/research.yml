name: Refresh prices and compare
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m btc_lab download --start 2020-01 --end 2026-09
      - run: python -m btc_lab run
      - run: python -m btc_lab robustness
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bitcoin-research-results
          path: |
            data/manifest.json
            data/download_attempt.json
            data/btcusdt_1h.csv.gz
            reports/*.csv
            reports/*.csv.gz
            reports/run.json
            reports/audit/
