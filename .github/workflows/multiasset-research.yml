name: Resume Kalshi multi-asset research
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Collect primary Kalshi contract history']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: kalshi-primary-history
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: sources/full100/zenbot/package-lock.json
      - name: Install the pinned research dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          npm ci --prefix sources/full100/zenbot --no-audit --no-fund
      - name: Check source, costs and leakage safeguards
        run: python -m pytest tests/test_multiasset_sources.py tests/test_multiasset_engine_models.py -q
      - name: Resume actual primary-price candidates with a time budget
        run: timeout --signal=TERM 70m python -m multiasset.pipeline --workers 2
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - name: Refresh the separate current prediction buffers
        if: always()
        run: timeout 6m python -m scripts.refresh_kalshi_current
      - name: Replay fixed indicator parameter neighbors
        if: always()
        run: timeout 15m python -m scripts.sensitivity_multiasset_indicators --workers 2
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
      - name: Audit and export only completed evidence
        if: always()
        run: |
          python -m scripts.audit_multiasset_results
          python -m scripts.joint_multiasset
          python -m scripts.export_multiasset
      - name: Preserve checkpoints and versioned inputs in the repository
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/multiasset KALSHI_MULTI_ASSET_RESEARCH.xlsx
          if [ -d data/kalshi/current ]; then
            git add data/kalshi/current
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Record resumable Kalshi research and honest model freshness'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-multi-asset-research
          path: |
            reports/multiasset/
            KALSHI_MULTI_ASSET_RESEARCH.xlsx
            data/kalshi/current/
          retention-days: 30
