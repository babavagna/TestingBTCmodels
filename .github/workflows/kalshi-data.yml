name: Collect primary Kalshi contract history
on:
  workflow_dispatch:
  push:
    paths:
      - 'multiasset/kalshi.py'
      - 'multiasset/registry.py'
      - 'sources/multiasset/original_dashboard_markets.json'
      - '.github/workflows/kalshi-data.yml'
  schedule:
    - cron: '41 */6 * * *'
permissions:
  contents: write
concurrency:
  group: kalshi-primary-history
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install data-only dependencies
        run: python -m pip install numpy==2.2.6 pandas==2.2.3 pyarrow==26.0.0 pytest==8.3.5
      - name: Check source and instrument safeguards
        run: python -m pytest tests/test_multiasset_sources.py -q
      - name: Resume primary Kalshi collection
        run: python -m multiasset.kalshi --workers 3 --max-windows 180
      - name: Preserve retrieval evidence and checkpoints
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/kalshi reports/kalshi
          if ! git diff --cached --quiet; then
            git commit -m 'Record primary Kalshi history collection and source status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kalshi-primary-source-evidence
          path: |
            data/kalshi/
            reports/kalshi/
          retention-days: 30
